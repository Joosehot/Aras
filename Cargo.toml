[package]
name = "aras"
version = "0.1.0"
edition = "2021"
description = "Deterministic natural-language-to-sewing-pattern engine: lexicon + drafting rules + beam search"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "aras"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
