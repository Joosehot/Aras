# Aras drafting rules and tradeoffs. Every number the engine uses lives here;
# rule code only names keys. All lengths are millimetres.
#
# Every construction choice is scored on three axes:
#   finish     - how well it wears and how professional it looks
#   simplicity - fewer pieces, fewer operations, easier for a beginner
#   economy    - less fabric, no second fabric
# A choice scores  weight * (axes . profile). The profile starts at
# [profile] and the sentence's modifiers shift it ("neatly", "simply",
# "cheaply"). This is FeelRight's tension curve and Senne's safety/brevity/
# perf profile: the words say which tradeoff to spend.

[search]
beam = 16

[profile]
finish = 1.0
simplicity = 0.6
economy = 0.4

[modifiers.neatly]
finish = 1.0
simplicity = -0.2

[modifiers.simply]
finish = -0.3
simplicity = 1.5

[modifiers.cheaply]
economy = 1.5

