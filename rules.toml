variants.straight = { finish = 0.8, simplicity = 0.8, economy = 0.4 }
variants.flare = { finish = 0.6, simplicity = 0.8, economy = 0.6 }

[rules.rise]
weight = 1.0
variants.at_waist = { finish = 0.8, simplicity = 0.9, economy = 0.5 }

[rules.neck_finish]        # knit necklines without a hood
weight = 1.0
variants.rib_band = { finish = 1.0, simplicity = 0.6, economy = 0.6 }
variants.self_band = { finish = 0.8, simplicity = 0.7, economy = 0.9 }
variants.binding = { finish = 0.6, simplicity = 0.5, economy = 1.0 }
variants.facing = { finish = 1.0, simplicity = 0.6, economy = 0.7 }   # woven necklines

[rules.skirt]              # dresses: the silhouette below the waist
