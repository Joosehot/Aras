# ---- Rules: one decision each, one file each in src/rules/ -----------------

[rules.sleeve_length]      # lengthen/shorten the sleeves
weight = 1.0
variants.extend_hem = { finish = 0.6, simplicity = 0.9, economy = 0.5 }
variants.keep_hem_width = { finish = 0.8, simplicity = 0.7, economy = 0.5 }

[rules.sleeve_width]       # widen/narrow the sleeves
weight = 1.0
variants.parallel = { finish = 0.6, simplicity = 0.9, economy = 0.4 }
variants.bicep_only = { finish = 0.8, simplicity = 0.7, economy = 0.6 }

[rules.neck_width]
weight = 1.0
variants.at_shoulder = { finish = 0.8, simplicity = 0.8, economy = 0.5 }

[rules.neck_depth]
weight = 1.0
variants.front_only = { finish = 0.8, simplicity = 0.8, economy = 0.5 }

[rules.body_length]
weight = 1.0
variants.at_hem = { finish = 0.8, simplicity = 0.9, economy = 0.5 }

[rules.chest_width]
weight = 1.0
variants.at_side = { finish = 0.8, simplicity = 0.9, economy = 0.5 }

[rules.seat_width]
weight = 1.0
variants.at_side = { finish = 0.8, simplicity = 0.9, economy = 0.5 }

[rules.leg_length]
weight = 1.0
variants.extend_hem = { finish = 0.6, simplicity = 0.9, economy = 0.5 }
variants.keep_hem_width = { finish = 0.8, simplicity = 0.7, economy = 0.5 }

[rules.leg_width]
