variants.hemmed = { finish = 0.6, simplicity = 1.0, economy = 0.9 }
variants.rib_cuff = { finish = 1.0, simplicity = 0.6, economy = 0.6 }
variants.barrel_cuff = { finish = 1.0, simplicity = 0.3, economy = 0.7 }
variants.hemmed_wide = { finish = 0.3, simplicity = 1.0, economy = 0.9 }

[rules.body_hem]
weight = 1.0
variants.hemmed = { finish = 0.6, simplicity = 1.0, economy = 0.9 }
variants.rib_band = { finish = 1.0, simplicity = 0.6, economy = 0.6 }
variants.shirttail = { finish = 1.0, simplicity = 0.6, economy = 0.8 }
variants.straight = { finish = 0.6, simplicity = 0.9, economy = 0.9 }

[rules.pocket]
weight = 1.0
variants.kangaroo = { finish = 0.8, simplicity = 0.8, economy = 0.6 }

[rules.waist]              # pants
weight = 1.0
variants.zip_fly = { finish = 1.0, simplicity = 0.3, economy = 0.7 }
variants.elastic = { finish = 0.5, simplicity = 1.0, economy = 0.8 }

# ---- Judges: score across the whole garment -----------------------------

# Rib at some edges and plain hems at others looks unplanned.
[judges.consistent_finish]
weight = 0.5
axes = { finish = 1.0 }

# A second fabric has to be bought once; every further rib part is free.
[judges.rib_fabric]
weight = 0.4
axes = { economy = 1.0, simplicity = 0.3 }

# Fabric used by the cutting layout, per square metre.
[judges.fabric_use]
weight = 0.5
axes = { economy = 1.0 }

# ---- Design: colours and prints --------------------------------------------

[design]
stripe_repeat = 24         # one stripe pair, mm
pinstripe_repeat = 14
gingham_repeat = 12
plaid_repeat = 90
dot_repeat = 26
camo_repeat = 180
floral_repeat = 240        # one tile of 24 scattered flowers; "small/tiny/ditsy" halves it
thin = 0.5                 # "thin/fine" scales the repeat
thick = 2.0                # "thick/bold/wide"
shade = 0.35               # "light"/"dark" mixes toward white/black
button_shade = 0.25        # tonal buttons, darker than the body
thread_shade = 0.2         # tonal thread
min_print_contrast = 1.3   # below this a print's colours barely read
drawstring_tail = 250      # each end hangs this far past the hood
flat_long_sleeve = 62      # flats: long sleeves hang this many degrees below horizontal
flat_short_sleeve = 30
sweep_band = 24            # one band of a hem-to-sleeve sweep, mm
sweep_start = 0.18         # the stack rises this share of the hem out from centre front
sweep_clear = 12           # the stack enters the armhole this far above the underarm
sweep_radius = 0.6         # quarter-circle radius, share of the way to the underarm

[design_defaults]          # colour when the sentence names none
tshirt = "white"
hoodie = "heather grey"
sweatshirt = "heather grey"
shirt = "sky blue"
pants = "khaki"
dress = "navy"
