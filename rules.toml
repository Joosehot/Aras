variants.back_zip = { finish = 1.0, simplicity = 0.4, economy = 0.7 }
variants.pull_on = { finish = 0.6, simplicity = 1.0, economy = 1.0 }

[rules.armhole_finish]     # sleeveless armholes
weight = 1.0
variants.facing = { finish = 1.0, simplicity = 0.6, economy = 0.7 }
