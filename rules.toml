# ---- Dresses -------------------------------------------------------------------
# Lengths are shares of waist-to-floor (body_rise + inside_leg) below the waist.

[dress]
mini = 0.38
knee = 0.55
midi = 0.72
maxi = 0.92
a_line_flare = 0.12        # A-line: each side seam steps out this far per mm below the hip
gather = 1.6               # gathered skirt: skirt waist / bodice waist
gather_min = 1.3           # gathering range a waist seam takes
gather_max = 2.2
sleeveless_raise = 15      # a sleeveless armhole sits this much higher
sleeveless_narrow = 15     # and the shoulder is this much shorter
armhole_ease = 60          # a sleeveless armhole is at least the upper arm plus this
facing_width = 60          # neck and armhole facings
zip_sizes = 400            # invisible zips come in 5 cm steps from this length
zip_max = 650

# ---- Drafting proportions -----------------------------------------------------

[drafting]
back_width_ease = 0.25     # share of chest ease that goes across the back
front_width_less = 10      # front across is narrower than back across
width_point = 0.55         # across-back level, share of shoulder-to-underarm
short_hem_ratio = 0.92     # short sleeve hem vs bicep
cap_min = 20               # flattest sleeve cap tried before deepening the armhole
cap_max = 260
armhole_step = 10          # armhole deepening per try when the cap won't fit
armhole_tries = 10
front_fork = 0.0625        # crotch extension, share of seat girth
back_fork = 0.1
leg_balance = 20           # back leg is wider than front by this (each of knee, hem)
cf_in = 10                 # centre front leans in at the waist
cb_in = 30                 # centre back leans in at the waist
cb_rise = 30               # centre back rises above the waist line
max_side_shape = 50        # waist suppression the side seam can take; the rest is a pleat
back_dart = 20
back_dart_length = 110

