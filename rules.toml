# ---- Fabrics ----------------------------------------------------------------
# stretch: how far a finished edge can be pulled (1.0 = not at all).
# cap_ease_*: how much longer the sleeve cap may be than the armhole.

[fabrics.jersey]
stretch = 1.4
seam = 10
hem = 20
cap_ease_min = 0
cap_ease_max = 10
width = 1500

[fabrics.fleece]
stretch = 1.3
seam = 10
hem = 25
cap_ease_min = 0
cap_ease_max = 10
width = 1500

[fabrics.shirting]
stretch = 1.0
seam = 15
hem = 10
cap_ease_min = 10
cap_ease_max = 30
width = 1500

[fabrics.twill]
stretch = 1.0
seam = 15
hem = 40
cap_ease_min = 10
cap_ease_max = 30
width = 1500

[fabrics.stretch_twill]
stretch = 1.2
seam = 15
hem = 40
cap_ease_min = 5
cap_ease_max = 20
width = 1500

[fabrics.crepe]            # woven dress fabric with drape
